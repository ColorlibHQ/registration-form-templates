<!doctype html>
<html lang="en">
  <head>
  	<title>Sign Up 03</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

		<link rel="stylesheet" href="css/style.css">
</head>
	<body>
	<section class="ftco-section">
		<div class="cl-container">
			<div class="cl-row cl-justify-content-center">
				<div class="cl-col-md-6 cl-text-center cl-mb-5">
					<h2 class="heading-section">Sign Up #03</h2>
				</div>
			</div>
			<div class="cl-row cl-justify-content-center">
				<div class="cl-col-md-12 cl-col-lg-10">
					<div class="wrap cl-d-md-flex">
						<div class="cl-text-wrap cl-p-4 cl-p-lg-5 cl-text-center cl-d-flex cl-align-items-center cl-order-md-last">
							<div class="text cl-w-100">
								<div class="icon"><span class="fa fa-soccer-ball-o"><svg class="cl-icon" viewBox="0 0 1792 1792" style="vertical-align:-0.1429em" aria-hidden="true" focusable="false"><g transform="translate(0,1536) scale(1,-1)"><path d="M609 720 896 928 1183 720 1074 384H719ZM548.0 1465.0Q714 1536 896.0 1536.0Q1078 1536 1244.0 1465.0Q1410 1394 1530.0 1274.0Q1650 1154 1721.0 988.0Q1792 822 1792.0 640.0Q1792 458 1721.0 292.0Q1650 126 1530.0 6.0Q1410 -114 1244.0 -185.0Q1078 -256 896.0 -256.0Q714 -256 548.0 -185.0Q382 -114 262.0 6.0Q142 126 71.0 292.0Q0 458 0.0 640.0Q0 822 71.0 988.0Q142 1154 262.0 1274.0Q382 1394 548.0 1465.0ZM1515 186Q1664 389 1664 640V643L1562 554L1322 778L1385 1101L1519 1089Q1369 1295 1130 1371L1183 1247L896 1088L609 1247L662 1371Q423 1295 273 1089L408 1101L470 778L230 554L128 643V640Q128 389 277 186L307 318L633 278L772 -20L656 -89Q773 -128 896.0 -128.0Q1019 -128 1136 -89L1020 -20L1159 278L1485 318Z"/></g></svg></span></div>
								<h2>Soccer Ball</h2>
								<p>Already have an account?</p>
								<a href="#" class="cl-btn btn-white btn-outline-white">Sign In</a>
							</div>
			      </div>
						<div class="login-wrap cl-p-4 cl-p-md-5">
			      	<h3 class="cl-mb-4">Hello! <span>Please signup to continue</span></h3>
							<form action="#" class="signup-form">
			      		<div class="cl-form-group cl-mb-4">
			      			<label class="label" for="name">Full Name</label>
			      			<input type="text" class="cl-form-control" placeholder="John Doe">
			      		</div>
			      		<div class="cl-form-group cl-mb-4">
			      			<label class="label" for="email">Email Address</label>
			      			<input type="text" class="cl-form-control" placeholder="johndoe@gmail.com">
			      		</div>
		            <div class="cl-form-group cl-mb-4">
		            	<label class="label" for="password">Password</label>
		              <input type="password" class="cl-form-control" placeholder="Password">
		            </div>
		            <div class="cl-form-group cl-mb-4">
		            	<label class="label" for="password">Confirm Password</label>
		              <input type="password" class="cl-form-control" placeholder="Confirm Password">
		            </div>
		            <div class="cl-form-group">
		            	<button type="submit" class="cl-btn cl-btn-primary cl-rounded submit cl-p-3">Sign Up</button>
		            </div>
		          </form>
		          <div class="cl-w-100 social-wrap">
		          	<p>
		          		<span>or</span>
		          		<span>Signup with</span>
		          	</p>
		          	<p class="social-media cl-d-flex cl-justify-content-center">
									<a href="#" class="social-icon facebook cl-d-flex cl-align-items-center cl-justify-content-center"><span class="fa fa-facebook"><svg class="cl-icon" viewBox="0 0 1024 1792" style="vertical-align:-0.1429em" aria-hidden="true" focusable="false"><g transform="translate(0,1536) scale(1,-1)"><path d="M959 1524V1260H802Q716 1260 686.0 1224.0Q656 1188 656 1116V927H949L910 631H656V-128H350V631H95V927H350V1145Q350 1331 454.0 1433.5Q558 1536 731 1536Q878 1536 959 1524Z"/></g></svg></span></a>
									<a href="#" class="social-icon twitter cl-d-flex cl-align-items-center cl-justify-content-center"><span class="fa fa-twitter"><svg class="cl-icon" viewBox="0 0 1664 1792" style="vertical-align:-0.1429em" aria-hidden="true" focusable="false"><g transform="translate(0,1536) scale(1,-1)"><path d="M1620 1128Q1553 1030 1458 961Q1459 947 1459 919Q1459 789 1421.0 659.5Q1383 530 1305.5 411.0Q1228 292 1121.0 200.5Q1014 109 863.0 54.5Q712 0 540 0Q269 0 44 145Q79 141 122 141Q347 141 523 279Q418 281 335.0 343.5Q252 406 221 503Q254 498 282 498Q325 498 367 509Q255 532 181.5 620.5Q108 709 108 826V830Q176 792 254 789Q188 833 149.0 904.0Q110 975 110 1058Q110 1146 154 1221Q275 1072 448.5 982.5Q622 893 820 883Q812 921 812 957Q812 1091 906.5 1185.5Q1001 1280 1135 1280Q1275 1280 1371 1178Q1480 1199 1576 1256Q1539 1141 1434 1078Q1527 1088 1620 1128Z"/></g></svg></span></a>
								</p>
								<p class="cl-mt-4">I'm already a member! <a href="#signin">Sign In</a></p>
		          </div>
		        </div>
		      </div>
				</div>
			</div>
		</div>
	</section>

	</body>
</html>
