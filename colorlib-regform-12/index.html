<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Sign Up Form by Colorlib</title>

    	<link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="main">

        <div class="cl-container">
            <form method="POST" class="appointment-form" id="appointment-form">
                <h2>education appointment form</h2>
                <div class="form-group-1">
                    <input type="text" name="title" id="title" placeholder="Title" required />
                    <input type="text" name="name" id="name" placeholder="Your Name" required />
                    <input type="email" name="email" id="email" placeholder="Email" required />
                    <input type="number" name="phone_number" id="phone_number" placeholder="Phone number" required />
                    <div class="select-list">
                        <ul class="cl-select-shell cl-select-full list-item"><li class="init"><select name="course_type" id="course_type" class="cl-select cl-sel-0">
                            <option slected value="">Course Type</option>
                            <option value="society">Society</option>
                            <option value="language">Language</option>
                        </select></li></ul>
                    </div>
                </div>
                <div class="form-group-2">
                    <h3>How would you like to bo located ?</h3>
                    <div class="select-list">
                        <ul class="cl-select-shell cl-select-full list-item"><li class="init"><select name="confirm_type" id="confirm_type" class="cl-select cl-sel-1">
                            <option seleected value="">By phone</option>
                            <option value="by_email">By email</option>
                        </select></li></ul>
                    </div>
                    <div class="select-list">
                        <ul class="cl-select-shell cl-select-full list-item"><li class="init"><select name="hour_appointment" id="hour_appointment" class="cl-select cl-sel-2">
                            <option seleected value="">Hours : 8am 10pm</option>
                            <option value="9h-11h">Hours : 9am 11pm</option>
                        </select></li></ul>
                    </div>
                </div>
                <div class="cl-form-check">
                    <input type="checkbox" name="agree-term" id="agree-term" class="agree-term" />
                    <label for="agree-term" class="label-agree-term"><span><span></span></span>I agree to the  <a href="#" class="term-service">Terms and Conditions</a></label>
                </div>
                <div class="form-submit">
                    <input type="submit" name="submit" id="submit" class="submit" value="Request an appointment" />
                </div>
            </form>
        </div>

    </div>

	<script src="js/snippet.js"></script>
</body><!-- This templates was made by Colorlib (https://colorlib.com) -->
</html>
