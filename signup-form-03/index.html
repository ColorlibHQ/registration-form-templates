<!doctype html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <title>Sign Up #3</title>
  	<link rel="stylesheet" href="css/style.css">
</head>
  <body>

  <div class="half">
    <div class="bg cl-order-1 cl-order-md-2" style="background-image: url('images/bg_1.jpg');"></div>
    <div class="contents cl-order-2 cl-order-md-1">

      <div class="cl-container">
        <div class="cl-row cl-align-items-center cl-justify-content-center">
          <div class="cl-col-md-6">
            <div class="form-block">
              <div class="cl-text-center cl-mb-5">
              <h3>Register</h3>
              
              </div>
              <form action="#" method="post">
                <div class="cl-form-group first">
                  <label for="name">Name</label>
                  <input type="text" class="cl-form-control" placeholder="John Doe" id="name">
                </div>
                <div class="cl-form-group first">
                  <label for="username">Email Address</label>
                  <input type="text" class="cl-form-control" placeholder="your-email@gmail.com" id="username">
                </div>
                <div class="cl-form-group">
                  <label for="password">Password</label>
                  <input type="password" class="cl-form-control" placeholder="Your Password" id="password">
                </div>
                <div class="cl-form-group last cl-mb-3">
                  <label for="re-password">Re-type Password</label>
                  <input type="password" class="cl-form-control" placeholder="Re-type Your Password" id="re-password">
                </div>
                
                <div class="cl-d-sm-flex cl-mb-5 cl-align-items-center">
                  <label class="control control--checkbox cl-mb-3 cl-mb-sm-0"><span class="caption">Agree our <a href="#">Terms and Conditions</a></span>
                    <input type="checkbox" checked="checked"/>
                    <div class="control__indicator"></div>
                  </label>
                  <span class="cl-ml-auto"><a href="#" class="forgot-pass">Have an account? Login</a></span> 
                </div>

                <input type="submit" value="Register" class="cl-btn cl-btn-block cl-btn-primary">

              </form>
            </div>
          </div>
        </div>
      </div>
    </div>

  </div>

    	<script src="js/snippet.js"></script>
</body>
</html>
