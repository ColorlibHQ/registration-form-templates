<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Required meta tags-->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="Colorlib Templates">
    <meta name="author" content="Colorlib">

    <!-- Title Page-->
    <title>Au Register Forms by Colorlib</title>

    	<link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="page-wrapper bg-gra-01 p-t-180 p-b-100 font-poppins">
        <div class="wrapper wrapper--w780">
            <div class="cl-card card-3">
                <div class="card-heading"></div>
                <div class="cl-card-body">
                    <h2 class="title">Registration Info</h2>
                    <form method="POST">
                        <div class="cl-input-group">
                            <input class="input--style-3" type="text" placeholder="Name" name="name">
                        </div>
                        <div class="cl-input-group">
                            <input type="text" data-date aria-label="Birthdate" class="input--style-3 js-datepicker" placeholder="Birthdate" name="birthday">
                            <i class="zmdi zmdi-calendar-note input-icon js-btn-calendar"><svg class="cl-icon" viewBox="0 0 384 512" style="vertical-align:-0.125em" aria-hidden="true" focusable="false"><g transform="translate(0,449) scale(1,-1)"><path d="M299 235V192H85V235ZM341 384Q359 384 371.5 371.5Q384 359 384 341V43Q384 25 371.5 12.5Q359 0 341 0H43Q25 0 12.5 12.5Q0 25 0 43V341Q0 359 12.5 371.5Q25 384 43 384H64V427H107V384H277V427H320V384ZM341 43V277H43V43ZM235 149V107H85V149Z"/></g></svg></i>
                        </div>
                        <div class="cl-input-group">
                            <div class="rs-select2 js-select-simple select--no-search">
                                <span class="cl-select-shell cl-select-full select2 select2-container select2-container--default" dir="ltr"><span class="selection"><span class="select2-selection select2-selection--single" aria-haspopup="true"><select name="gender" class="cl-select cl-sel-0">
                                    <option disabled="disabled" selected="selected">Gender</option>
                                    <option>Male</option>
                                    <option>Female</option>
                                    <option>Other</option>
                                </select><span class="select2-selection__arrow" role="presentation"><b role="presentation"></b></span></span></span></span>
                                <div class="select-dropdown"></div>
                            </div>
                        </div>
                        <div class="cl-input-group">
                            <input class="input--style-3" type="email" placeholder="Email" name="email">
                        </div>
                        <div class="cl-input-group">
                            <input class="input--style-3" type="text" placeholder="Phone" name="phone">
                        </div>
                        <div class="p-t-10">
                            <button class="cl-btn btn--pill btn--green" type="submit">Submit</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

	<script src="js/snippet.js"></script>
</body><!-- This templates was made by Colorlib (https://colorlib.com) -->

</html>
