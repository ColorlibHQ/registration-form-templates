<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<title>Form-v3 by Colorlib</title>
	<!-- Mobile Specific Metas -->
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">

	<!-- datepicker -->

    	<link rel="stylesheet" href="css/style.css">
</head>
<body class="form-v3">
	<div class="page-content">
		<div class="form-v3-content">
			<form class="form-detail" action="#" method="post" id="myform">
				<h2>Booking Tickets</h2>
				<p class="text">Orci ac auctor augue mauris augue neque gravida in hendrerit gravida rutrum.</p>
				<div class="cl-form-group">
					<div class="cl-form-row form-row-1">
						<label for="full-name">FULL NAME::</label>
						<input type="text" name="full-name" id="full-name" class="input-text" required>
					</div>
					<div class="cl-form-row form-row-1">
						<label for="your-email">YOUR EMAIL:</label>
						<input type="text" name="your-email" id="your-email" class="input-text" required>
					</div>
				</div>
				<div class="cl-form-group form-group-1">
					<div class="cl-form-row form-row-2">
						<label for="person">PERSON:</label>
						<input type="number" id="person" class="input-text" name="person" value="1" title="Qty" size="4" pattern="[0-9]*" inputmode="numeric">
					</div>
					<div class="cl-form-row form-row-3">
						<label for="date">DATE:</label>
						<input type="date" name="date" class="date" id="date">
					</div>
					<div class="cl-form-row form-row-4">
						<label for="ticket">TICKET TYPE:</label>
						<select name="position" id="ticket" class="input-text" >
						    <option value="vip">VIP</option>
						    <option value="luxury">Luxury</option>
						    <option value="basic">Basic</option>
						    <option value="normal">Normal</option>
						</select>
						<span class="select-btn">
						  	<i class="zmdi zmdi-chevron-down"><svg class="cl-icon" viewBox="0 0 256 512" style="vertical-align:-0.125em" aria-hidden="true" focusable="false"><g transform="translate(0,449) scale(1,-1)"><path d="M226 265 256 235 128 107 0 235 30 265 128 167Z"/></g></svg></i>
						</span>
					</div>
				</div>
				<div class="special">
					<span>$20.00</span>
					<p>/ VIP Person</p>
				</div>
				<div class="form-checkbox">
					<label class="cl-container"><p>By booking, you agree to the <a href="#" class="text">Terms of Service</a></p>
					  	<input type="checkbox" name="checkbox">
					  	<span class="checkmark"></span>
					</label>
				</div>
				<div class="form-row-last">
					<input type="submit" name="register" class="register" value="BUY NOW">
				</div>
			</form>
			<div class="form-right">
				<div class="form-images-1">
					<img src="images/form-v3-1.jpg" alt="form-v3-1">
				</div>
				<div class="form-images-2">
					<img src="images/form-v3-2.jpg" alt="form-v3-2">
				</div>
				<div class="form-icon-1">
					<a href="#"><i class="zmdi zmdi-chevron-left"><svg class="cl-icon" viewBox="0 0 158 512" style="vertical-align:-0.125em" aria-hidden="true" focusable="false"><g transform="translate(0,449) scale(1,-1)"><path d="M158 290 60 192 158 94 128 64 0 192 128 320Z"/></g></svg></i></a>
				</div>
				<div class="form-icon-2">
					<a href="#"><i class="zmdi zmdi-chevron-right"><svg class="cl-icon" viewBox="0 0 158 512" style="vertical-align:-0.125em" aria-hidden="true" focusable="false"><g transform="translate(0,449) scale(1,-1)"><path d="M30 320 158 192 30 64 0 94 98 192 0 290Z"/></g></svg></i></a>
				</div>
			</div>
		</div>
	</div>

	<script src="js/snippet.js"></script>
</body><!-- This templates was made by Colorlib (https://colorlib.com) -->
</html>
