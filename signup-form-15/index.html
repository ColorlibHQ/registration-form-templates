<!doctype html>
<html lang="en">
  <head>
  	<title>Sign Up 05</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

		<link rel="stylesheet" href="css/style.css">
</head>
	<body>
	<section class="ftco-section">
		<div class="cl-container">
			<div class="cl-row cl-justify-content-center">
				<div class="cl-col-md-6 cl-text-center cl-mb-5">
					<h2 class="heading-section">Sign Up #05</h2>
				</div>
			</div>
			<div class="cl-row cl-justify-content-center">
				<div class="cl-col-md-7 cl-col-lg-5">
					<div class="login-wrap cl-p-4 cl-p-md-5">
		      	<h3 class="cl-mb-4">Sign Up</h3>
						<form action="#" class="signup-form">
		      		<div class="cl-form-group">
		      			<label class="label" for="name">Full Name</label>
		      			<input type="text" class="cl-form-control" placeholder="John Doe">
		      		</div>
		      		<div class="cl-form-group">
		      			<label class="label" for="email">Email Address</label>
		      			<input type="text" class="cl-form-control" placeholder="johndoe@gmail.com">
		      		</div>
	            <div class="cl-form-group">
	            	<label class="label" for="password">Password</label>
	              <input id="password-field" type="password" class="cl-form-control" placeholder="Password">
	            </div>
	            <div class="cl-form-group">
	            	<label class="label" for="password">Confirm Password</label>
	              <input id="password-field" type="password" class="cl-form-control" placeholder="Confirm Password">
	            </div>
	            <div class="cl-form-group cl-d-flex cl-justify-content-end cl-mt-5">
	            	<button type="submit" class="cl-btn cl-btn-primary submit"><span class="fa fa-paper-plane"><svg class="cl-icon" viewBox="0 0 1792 1792" style="vertical-align:-0.1429em" aria-hidden="true" focusable="false"><g transform="translate(0,1536) scale(1,-1)"><path d="M1764 1525Q1797 1501 1791 1461L1535 -75Q1530 -104 1503 -120Q1489 -128 1472 -128Q1461 -128 1448 -123L995 62L753 -233Q735 -256 704 -256Q691 -256 682 -252Q663 -245 651.5 -228.5Q640 -212 640 -192V157L1504 1216L435 291L40 453Q3 467 0 508Q-2 548 32 567L1696 1527Q1711 1536 1728 1536Q1748 1536 1764 1525Z"/></g></svg></span></button>
	            </div>
	          </form>
	          <p class="cl-text-center">Already have an account? <a href="#signin">Sign In</a></p>
	        </div>
				</div>
			</div>
		</div>
	</section>

	</body>
</html>
