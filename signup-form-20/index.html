<!doctype html>
<html lang="en">
  <head>
  	<title>Sign Up 10</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

		<link rel="stylesheet" href="css/style.css">
</head>
	<body>
	<section class="ftco-section">
		<div class="cl-container">
			<div class="cl-row cl-justify-content-center">
				<div class="cl-col-md-6 cl-text-center cl-mb-5">
					<h2 class="heading-section">Sign Up #10</h2>
				</div>
			</div>
			<div class="cl-row cl-justify-content-center">
				<div class="cl-col-lg-10">
					<div class="wrap cl-d-md-flex">
						<div class="cl-text-wrap cl-p-4 cl-p-lg-5 cl-d-flex img cl-d-flex cl-align-items-end" style="background-image: url(images/bg.jpg);">
							<div class="text cl-w-100">
								<h2 class="cl-mb-4">Welcome to signup form</h2>
								<p>Far far away, behind the word mountains, far from the countries Vokalia and Consonantia, there live the blind texts.</p>
							</div>
			      </div>
						<div class="login-wrap cl-p-4 cl-p-md-5">
	      			<h3 class="cl-mb-3">Create an account</h3>
							<form action="#" class="signup-form">
								<div class="cl-row">
									<div class="cl-col-md-12">
										<div class="cl-form-group cl-d-flex cl-align-items-center">
					      			<label class="label" for="name">Full Name</label>
					      			<input type="text" class="cl-form-control" placeholder="Full Name">
					      		</div>
									</div>
									<div class="cl-col-md-12">
										<div class="cl-form-group cl-d-flex cl-align-items-center">
					      			<label class="label" for="email">Email Address</label>
					      			<input type="text" class="cl-form-control" placeholder="johndoe@email.com">
					      		</div>
									</div>
									<div class="cl-col-md-12">
										<div class="cl-form-group cl-d-flex cl-align-items-center">
					      			<label class="label" for="phone">Phone no.</label>
					      			<input type="text" class="cl-form-control" placeholder="+01">
					      		</div>
									</div>
									<div class="cl-col-md-12">
										<div class="cl-form-group cl-d-flex cl-align-items-center">
				            	<label class="label" for="password">Password</label>
				              <input type="password" class="cl-form-control" placeholder="Password">
				            </div>
									</div>
									<div class="cl-col-md-12">
										<div class="cl-form-group cl-d-flex cl-align-items-center">
					      			<label class="label" for="website">Website</label>
					      			<input type="text" class="cl-form-control" placeholder="Website">
					      		</div>
									</div>
									<div class="cl-col-md-12 cl-my-4">
										<div class="cl-form-group">
				            	<div class="cl-w-100">
					            	<label class="checkbox-wrap checkbox-primary">I agree all statements in terms of service
												  <input type="checkbox" checked>
												  <span class="checkmark"></span>
												</label>
											</div>
				            </div>
									</div>
									<div class="cl-col-md-12">
										<div class="cl-form-group">
				            	<button type="submit" class="cl-btn cl-btn-secondary submit cl-p-3">Create an account</button>
				            </div>
									</div>
								</div>

		          </form>
		          <div class="social-wrap">
		          	<p class="or">
		          		<span>or</span>
		          	</p>
		      			<p class="cl-mb-3 cl-text-center">Signup with this services</p>
		      			<p class="social-media cl-d-flex cl-justify-content-center">
		      				<a href="#" class="social-icon google cl-d-flex cl-align-items-center cl-justify-content-center"><span class="fa fa-google"><svg class="cl-icon" viewBox="0 0 1536 1792" style="vertical-align:-0.1429em" aria-hidden="true" focusable="false"><g transform="translate(0,1536) scale(1,-1)"><path d="M768 750H1493Q1505 683 1505 622Q1505 405 1414.0 234.5Q1323 64 1154.5 -32.0Q986 -128 768 -128Q611 -128 469.0 -67.5Q327 -7 224.0 96.0Q121 199 60.5 341.0Q0 483 0.0 640.0Q0 797 60.5 939.0Q121 1081 224.0 1184.0Q327 1287 469.0 1347.5Q611 1408 768 1408Q1068 1408 1283 1207L1074 1006Q951 1125 768 1125Q639 1125 529.5 1060.0Q420 995 356.0 883.5Q292 772 292.0 640.0Q292 508 356.0 396.5Q420 285 529.5 220.0Q639 155 768 155Q855 155 928.0 179.0Q1001 203 1048.0 239.0Q1095 275 1130.0 321.0Q1165 367 1181.5 408.0Q1198 449 1204 486H768Z"/></g></svg></span></a>
									<a href="#" class="social-icon facebook cl-d-flex cl-align-items-center cl-justify-content-center"><span class="fa fa-facebook"><svg class="cl-icon" viewBox="0 0 1024 1792" style="vertical-align:-0.1429em" aria-hidden="true" focusable="false"><g transform="translate(0,1536) scale(1,-1)"><path d="M959 1524V1260H802Q716 1260 686.0 1224.0Q656 1188 656 1116V927H949L910 631H656V-128H350V631H95V927H350V1145Q350 1331 454.0 1433.5Q558 1536 731 1536Q878 1536 959 1524Z"/></g></svg></span></a>
									<a href="#" class="social-icon twitter cl-d-flex cl-align-items-center cl-justify-content-center"><span class="fa fa-twitter"><svg class="cl-icon" viewBox="0 0 1664 1792" style="vertical-align:-0.1429em" aria-hidden="true" focusable="false"><g transform="translate(0,1536) scale(1,-1)"><path d="M1620 1128Q1553 1030 1458 961Q1459 947 1459 919Q1459 789 1421.0 659.5Q1383 530 1305.5 411.0Q1228 292 1121.0 200.5Q1014 109 863.0 54.5Q712 0 540 0Q269 0 44 145Q79 141 122 141Q347 141 523 279Q418 281 335.0 343.5Q252 406 221 503Q254 498 282 498Q325 498 367 509Q255 532 181.5 620.5Q108 709 108 826V830Q176 792 254 789Q188 833 149.0 904.0Q110 975 110 1058Q110 1146 154 1221Q275 1072 448.5 982.5Q622 893 820 883Q812 921 812 957Q812 1091 906.5 1185.5Q1001 1280 1135 1280Q1275 1280 1371 1178Q1480 1199 1576 1256Q1539 1141 1434 1078Q1527 1088 1620 1128Z"/></g></svg></span></a>
								</p>
	          	</div>
		          <div class="cl-w-100 cl-text-center">
								<p class="cl-mt-4">I'm already a member! <a href="#signin">Sign In</a></p>
		          </div>
		        </div>
		      </div>
				</div>
			</div>
		</div>
	</section>

	</body>
</html>
