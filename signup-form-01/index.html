<!doctype html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <title>Sign Up #1</title>
  	<link rel="stylesheet" href="css/style.css">
</head>
  <body>

  <div class="cl-d-lg-flex half">
    <div class="bg cl-order-1 cl-order-md-2" style="background-image: url('images/bg_1.jpg');"></div>
    <div class="contents cl-order-2 cl-order-md-1">

      <div class="cl-container">
        <div class="cl-row cl-align-items-center cl-justify-content-center">
          <div class="cl-col-md-7">
            <h3 class="cl-mb-4">Sign Up</h3>
            
            <form action="#" method="post">
              <div class="cl-form-group first">
                <label for="name">Name</label>
                <input type="text" class="cl-form-control" placeholder="e.g John Smith" id="name">
              </div>
              <div class="cl-form-group">
                <label for="email">Email</label>
                <input type="text" class="cl-form-control" placeholder="your-email@gmail.com" id="email">
              </div>
              <div class="cl-form-group">
                <label for="password">Password</label>
                <input type="password" class="cl-form-control" placeholder="Your Password" id="password">
              </div>
              <div class="cl-form-group last cl-mb-3">
                <label for="retype-password">Re-type Password</label>
                <input type="password" class="cl-form-control" placeholder="Re-Type Your Password" id="retype-password">
              </div>
              
              <div class="cl-d-flex cl-mb-5 cl-align-items-center">
                <label class="control control--checkbox cl-mb-0"><span class="caption">Creating an account means you're okay with our <a href="#">Terms and Conditions</a> and our <a href="#">Privacy Policy</a>.</span>
                  <input type="checkbox" checked="checked"/>
                  <div class="control__indicator"></div>
                </label>
              </div>

              <input type="submit" value="Register" class="cl-btn cl-btn-block cl-btn-primary">

            </form>
          </div>
        </div>
      </div>
    </div>

  </div>

    	<script src="js/snippet.js"></script>
</body>
</html>
