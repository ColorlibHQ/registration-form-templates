<!doctype html>
<html lang="en">
  <head>
  	<title>Sign Up 01</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

		<link rel="stylesheet" href="css/style.css">
</head>
	<body>
	<section class="ftco-section">
		<div class="cl-container">
			<div class="cl-row cl-justify-content-center">
				<div class="cl-col-md-6 cl-text-center cl-mb-5">
					<h2 class="heading-section">Sign Up #01</h2>
				</div>
			</div>
			<div class="cl-row cl-justify-content-center">
				<div class="cl-col-md-9 cl-col-lg-6">
					<div class="login-wrap">
		      	<h3 class="cl-mb-4 cl-text-center">Create Your Account</h3>
						<form action="#" class="signup-form">
							<div class="cl-row">
								<div class="cl-col-md-6">
									<div class="cl-form-group cl-mb-4">
				      			<input type="text" class="cl-form-control" placeholder="John">
				      		</div>
								</div>
								<div class="cl-col-md-6">
									<div class="cl-form-group cl-mb-4">
				      			<input type="text" class="cl-form-control" placeholder="Doe">
				      		</div>
								</div>
								<div class="cl-col-md-12">
									<div class="cl-form-group cl-mb-4">
				      			<input type="text" class="cl-form-control" placeholder="johndoe@gmail.com">
				      		</div>
								</div>
								<div class="cl-col-md-6">
									<div class="cl-form-group cl-mb-4">
			              <input type="password" class="cl-form-control" placeholder="Password">
			            </div>
								</div>
								<div class="cl-col-md-6">
									<div class="cl-form-group cl-mb-4">
			              <input type="password" class="cl-form-control" placeholder="Confirm Password">
			            </div>
								</div>
								<div class="cl-col-md-12">
									<div class="cl-form-group cl-d-flex">
			            	<button type="submit" class="cl-btn cl-btn-primary cl-rounded submit cl-p-3">Sign Up</button>
			            </div>
								</div>
							</div>
	          </form>
	          <div class="cl-w-100 social-wrap">
	          	<p>
	          		<span>or Signup with this services below</span>
	          	</p>
	          	<p class="social-media cl-d-flex cl-justify-content-center">
								<a href="#" class="social-icon facebook cl-d-flex cl-align-items-center cl-justify-content-center"><span class="fa fa-facebook"><svg class="cl-icon" viewBox="0 0 1024 1792" style="vertical-align:-0.1429em" aria-hidden="true" focusable="false"><g transform="translate(0,1536) scale(1,-1)"><path d="M959 1524V1260H802Q716 1260 686.0 1224.0Q656 1188 656 1116V927H949L910 631H656V-128H350V631H95V927H350V1145Q350 1331 454.0 1433.5Q558 1536 731 1536Q878 1536 959 1524Z"/></g></svg></span> Facebook</a>
								<a href="#" class="social-icon twitter cl-d-flex cl-align-items-center cl-justify-content-center"><span class="fa fa-twitter"><svg class="cl-icon" viewBox="0 0 1664 1792" style="vertical-align:-0.1429em" aria-hidden="true" focusable="false"><g transform="translate(0,1536) scale(1,-1)"><path d="M1620 1128Q1553 1030 1458 961Q1459 947 1459 919Q1459 789 1421.0 659.5Q1383 530 1305.5 411.0Q1228 292 1121.0 200.5Q1014 109 863.0 54.5Q712 0 540 0Q269 0 44 145Q79 141 122 141Q347 141 523 279Q418 281 335.0 343.5Q252 406 221 503Q254 498 282 498Q325 498 367 509Q255 532 181.5 620.5Q108 709 108 826V830Q176 792 254 789Q188 833 149.0 904.0Q110 975 110 1058Q110 1146 154 1221Q275 1072 448.5 982.5Q622 893 820 883Q812 921 812 957Q812 1091 906.5 1185.5Q1001 1280 1135 1280Q1275 1280 1371 1178Q1480 1199 1576 1256Q1539 1141 1434 1078Q1527 1088 1620 1128Z"/></g></svg></span> Twitter</a>
							</p>
							<p class="cl-mt-4">I'm already a member! <a href="#signin">Sign In</a></p>
	          </div>
	        </div>
				</div>
			</div>
		</div>
	</section>

	</body>
</html>
