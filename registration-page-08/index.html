<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registration Page V08 | Colorlib</title>
  
  	<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="cl-register08-demo">
    <section class="cl-register08" aria-labelledby="cl-register08-title">
      <div class="cl-register08__cover">
        <img class="cl-register08__cover-img" src="images/kingfisher.jpg" width="1200" height="420" alt="A kingfisher perched on a branch against a soft green background">
        <p class="cl-register08__members"><strong>18,400</strong> birders sharing sightings this week</p>
      </div>

      <form class="cl-register08__form" data-form novalidate>
        <div class="cl-register08__avatar-row">
          <div class="cl-register08__avatar" data-avatar>
            <span class="cl-register08__initials" data-initials aria-hidden="true">?</span>
            <img class="cl-register08__avatar-img" data-avatar-img alt="" width="112" height="112" hidden>
          </div>
          <div class="cl-register08__avatar-actions" data-field data-file-field>
            <input class="cl-register08__file" id="cl-register08-photo" name="photo" type="file" accept="image/png,image/jpeg,image/webp,image/gif" aria-describedby="cl-register08-photo-hint cl-register08-photo-err" data-file>
            <label class="cl-register08__upload" for="cl-register08-photo">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4Z"/><circle cx="12" cy="13" r="3.5"/></svg>
              <span data-upload-label>Add a profile photo</span>
            </label>
            <button class="cl-register08__remove" type="button" data-remove hidden>Remove photo</button>
            <p class="cl-register08__hint" id="cl-register08-photo-hint">Optional. JPG, PNG or WebP, up to 2 MB.</p>
            <p class="cl-register08__error" id="cl-register08-photo-err" data-error></p>
          </div>
        </div>

        <h1 class="cl-register08__title" id="cl-register08-title">Join the flock</h1>
        <p class="cl-register08__sub">Log sightings, swap ID tips and find walks near you. Nightjar is free and ad-free.</p>

        <div class="cl-register08__grid">
          <div class="cl-register08__field" data-field>
            <label class="cl-register08__label" for="cl-register08-name">Display name</label>
            <input class="cl-register08__input" id="cl-register08-name" name="name" type="text" autocomplete="name" required maxlength="40" data-msg="Add a display name." aria-describedby="cl-register08-name-err">
            <p class="cl-register08__error" id="cl-register08-name-err" data-error></p>
          </div>
          <div class="cl-register08__field" data-field>
            <label class="cl-register08__label" for="cl-register08-handle">Handle</label>
            <div class="cl-register08__handle">
              <span aria-hidden="true">@</span>
              <input class="cl-register08__input" id="cl-register08-handle" name="handle" type="text" autocomplete="username" autocapitalize="off" spellcheck="false" required minlength="3" maxlength="20" pattern="[a-z0-9_]{3,20}" data-msg="Pick a handle." data-pattern="Use 3–20 lowercase letters, numbers or underscores." aria-describedby="cl-register08-handle-err">
            </div>
            <p class="cl-register08__error" id="cl-register08-handle-err" data-error></p>
          </div>
          <div class="cl-register08__field" data-field>
            <label class="cl-register08__label" for="cl-register08-email">Email</label>
            <input class="cl-register08__input" id="cl-register08-email" name="email" type="email" autocomplete="email" required data-msg="Enter your email." aria-describedby="cl-register08-email-err">
            <p class="cl-register08__error" id="cl-register08-email-err" data-error></p>
          </div>
          <div class="cl-register08__field" data-field>
            <label class="cl-register08__label" for="cl-register08-pw">Password</label>
            <div class="cl-register08__pw">
              <input class="cl-register08__input" id="cl-register08-pw" name="password" type="password" autocomplete="new-password" required minlength="8" data-msg="Create a password." aria-describedby="cl-register08-pw-err">
              <button class="cl-register08__eye" type="button" aria-label="Show password" aria-pressed="false" aria-controls="cl-register08-pw" data-pw-toggle>
                <svg class="cl-register08__eye-on" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg class="cl-register08__eye-off" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18M10.6 5.1A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.1M6.6 6.6C3.9 8.3 2 12 2 12s3.6 7 10 7a9.8 9.8 0 0 0 5.4-1.6M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
              </button>
            </div>
            <p class="cl-register08__error" id="cl-register08-pw-err" data-error></p>
          </div>
        </div>

        <fieldset class="cl-register08__field cl-register08__interests" data-field data-chips aria-describedby="cl-register08-chips-err">
          <legend class="cl-register08__label">What are you into? <span class="cl-register08__count" id="cl-register08-chips-count" data-chip-count>Pick at least 3</span></legend>
          <div class="cl-register08__chips">
            <label class="cl-register08__chip"><input type="checkbox" name="topic" value="Garden birds"><span>Garden birds</span></label>
            <label class="cl-register08__chip"><input type="checkbox" name="topic" value="Waders and shorebirds"><span>Waders &amp; shorebirds</span></label>
            <label class="cl-register08__chip"><input type="checkbox" name="topic" value="Birds of prey"><span>Birds of prey</span></label>
            <label class="cl-register08__chip"><input type="checkbox" name="topic" value="Migration"><span>Migration</span></label>
            <label class="cl-register08__chip"><input type="checkbox" name="topic" value="Bird song"><span>Bird song</span></label>
            <label class="cl-register08__chip"><input type="checkbox" name="topic" value="Photography"><span>Photography</span></label>
            <label class="cl-register08__chip"><input type="checkbox" name="topic" value="Nest boxes"><span>Nest boxes</span></label>
            <label class="cl-register08__chip"><input type="checkbox" name="topic" value="Rarities"><span>Rarities</span></label>
            <label class="cl-register08__chip"><input type="checkbox" name="topic" value="Guided walks"><span>Guided walks</span></label>
          </div>
          <p class="cl-register08__error" id="cl-register08-chips-err" data-error></p>
        </fieldset>

        <div class="cl-register08__switch-row">
          <label class="cl-register08__switch-text" for="cl-register08-digest"><strong>Weekly sightings digest</strong> The best photos and rare birds near you, every Sunday.</label>
          <input class="cl-register08__switch" id="cl-register08-digest" name="digest" type="checkbox" role="switch" checked>
        </div>

        <button class="cl-register08__submit" type="submit">Join Nightjar</button>
        <div class="cl-register08__live" role="status" aria-live="polite" data-live></div>
        <p class="cl-register08__foot">Already a member? <a class="cl-register08__link" href="#">Log in</a> &middot; <span class="cl-register08__demo">Demo &mdash; nothing is sent or uploaded.</span></p>
      </form>

      <div class="cl-register08__done" data-success tabindex="-1" hidden>
        <div class="cl-register08__done-avatar" data-done-avatar aria-hidden="true"></div>
        <h2 class="cl-register08__title" data-done-title></h2>
        <p class="cl-register08__sub" data-done-text></p>
        <ul class="cl-register08__done-tags" data-done-tags aria-label="Your interests"></ul>
      </div>
    </section>
  </main>
	<script src="js/snippet.js"></script>
</body>
</html>
