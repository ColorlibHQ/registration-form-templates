<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Required meta tags-->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="Colorlib Templates">
    <meta name="author" content="Colorlib">
    <meta name="keywords" content="Colorlib Templates">

    <!-- Title Page-->
    <title>Au Register Forms by Colorlib</title>

    	<link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="page-wrapper bg-gra-02 p-t-130 p-b-100 font-poppins">
        <div class="wrapper wrapper--w680">
            <div class="cl-card card-4">
                <div class="cl-card-body">
                    <h2 class="title">Registration Form</h2>
                    <form method="POST">
                        <div class="cl-row row-space">
                            <div class="cl-col-2">
                                <div class="cl-input-group">
                                    <label class="label">first name</label>
                                    <input class="input--style-4" type="text" name="first_name">
                                </div>
                            </div>
                            <div class="cl-col-2">
                                <div class="cl-input-group">
                                    <label class="label">last name</label>
                                    <input class="input--style-4" type="text" name="last_name">
                                </div>
                            </div>
                        </div>
                        <div class="cl-row row-space">
                            <div class="cl-col-2">
                                <div class="cl-input-group">
                                    <label class="label">Birthday</label>
                                    <div class="input-group-icon">
                                        <input type="date" class="input--style-4 js-datepicker" name="birthday">
                                        <i class="zmdi zmdi-calendar-note input-icon js-btn-calendar"><svg class="cl-icon" viewBox="0 0 384 512" style="vertical-align:-0.125em" aria-hidden="true" focusable="false"><g transform="translate(0,449) scale(1,-1)"><path d="M299 235V192H85V235ZM341 384Q359 384 371.5 371.5Q384 359 384 341V43Q384 25 371.5 12.5Q359 0 341 0H43Q25 0 12.5 12.5Q0 25 0 43V341Q0 359 12.5 371.5Q25 384 43 384H64V427H107V384H277V427H320V384ZM341 43V277H43V43ZM235 149V107H85V149Z"/></g></svg></i>
                                    </div>
                                </div>
                            </div>
                            <div class="cl-col-2">
                                <div class="cl-input-group">
                                    <label class="label">Gender</label>
                                    <div class="p-t-10">
                                        <label class="radio-container m-r-45">Male
                                            <input type="radio" checked="checked" name="gender">
                                            <span class="checkmark"></span>
                                        </label>
                                        <label class="radio-container">Female
                                            <input type="radio" name="gender">
                                            <span class="checkmark"></span>
                                        </label>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="cl-row row-space">
                            <div class="cl-col-2">
                                <div class="cl-input-group">
                                    <label class="label">Email</label>
                                    <input class="input--style-4" type="email" name="email">
                                </div>
                            </div>
                            <div class="cl-col-2">
                                <div class="cl-input-group">
                                    <label class="label">Phone Number</label>
                                    <input class="input--style-4" type="text" name="phone">
                                </div>
                            </div>
                        </div>
                        <div class="cl-input-group">
                            <label class="label">Subject</label>
                            <div class="rs-select2 js-select-simple select--no-search">
                                <span class="cl-select-shell cl-select-full select2 select2-container select2-container--default" dir="ltr"><span class="selection"><span class="select2-selection select2-selection--single" aria-haspopup="true"><select name="subject" class="cl-select cl-sel-0">
                                    <option disabled="disabled" selected="selected">Choose option</option>
                                    <option>Subject 1</option>
                                    <option>Subject 2</option>
                                    <option>Subject 3</option>
                                </select><span class="select2-selection__arrow" role="presentation"><b role="presentation"></b></span></span></span></span>
                                <div class="select-dropdown"></div>
                            </div>
                        </div>
                        <div class="p-t-15">
                            <button class="cl-btn btn--radius-2 btn--blue" type="submit">Submit</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

	<script src="js/snippet.js"></script>
</body><!-- This templates was made by Colorlib (https://colorlib.com) -->

</html>
<!-- end document-->
