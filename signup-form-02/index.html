<!doctype html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <title>Sign Up #2</title>
  	<link rel="stylesheet" href="css/style.css">
</head>
  <body>

  <div class="cl-d-lg-flex half">
    <div class="bg cl-order-1 cl-order-md-2" style="background-image: url('images/bg_1.jpg');"></div>
    <div class="contents cl-order-2 cl-order-md-1">

      <div class="cl-container">
        <div class="cl-row cl-align-items-center cl-justify-content-center">
          <div class="cl-col-md-7 cl-py-5">
            <h3>Register</h3>
            <p class="cl-mb-4">Lorem ipsum dolor sit amet elit. Sapiente sit aut eos consectetur adipisicing.</p>
            <form action="#" method="post">
              <div class="cl-row">
                <div class="cl-col-md-6">
                  <div class="cl-form-group first">
                    <label for="fname">First Name</label>
                    <input type="text" class="cl-form-control" placeholder="e.g. John" id="fname">
                  </div>    
                </div>
                <div class="cl-col-md-6">
                  <div class="cl-form-group first">
                    <label for="lname">Last Name</label>
                    <input type="text" class="cl-form-control" placeholder="e.g. Smith" id="lname">
                  </div>    
                </div>
              </div>
              <div class="cl-row">
                <div class="cl-col-md-12">
                  <div class="cl-form-group first">
                    <label for="email">Email Address</label>
                    <input type="email" class="cl-form-control" placeholder="e.g. john@your-domain.com" id="email">
                  </div>    
                </div>
              </div>
              <div class="cl-row">
                <div class="cl-col-md-6">
                  <div class="cl-form-group first">
                    <label for="lname">Phone Number</label>
                    <input type="text" class="cl-form-control" placeholder="+00 0000 000 0000" id="lname">
                  </div>    
                </div>
                <div class="cl-col-md-6">
                  <div class="cl-form-group first">
                    <label for="lname">Website</label>
                    <input type="text" class="cl-form-control" placeholder="e.g. https://google.com" id="lname">
                  </div>    
                </div>
              </div>
              <div class="cl-row">
                <div class="cl-col-md-6">
              
                  <div class="cl-form-group last cl-mb-3">
                    <label for="password">Password</label>
                    <input type="password" class="cl-form-control" placeholder="Your Password" id="password">
                  </div>
                </div>
                <div class="cl-col-md-6">
              
                  <div class="cl-form-group last cl-mb-3">
                    <label for="re-password">Re-type Password</label>
                    <input type="password" class="cl-form-control" placeholder="Your Password" id="re-password">
                  </div>
                </div>
              </div>
              
              <div class="cl-d-flex cl-mb-5 cl-mt-4 cl-align-items-center">
                <div class="cl-d-flex cl-align-items-center">
                <label class="control control--checkbox cl-mb-0"><span class="caption">Creating an account means you're okay with our <a href="#">Terms and Conditions</a> and our <a href="#">Privacy Policy</a>.</span>
                  <input type="checkbox" checked="checked"/>
                  <div class="control__indicator"></div>
                </label>
              </div>
              </div>

              <input type="submit" value="Register" class="cl-btn cl-px-5 cl-btn-primary">

            </form>
          </div>
        </div>
      </div>
    </div>

  </div>

    	<script src="js/snippet.js"></script>
</body>
</html>
